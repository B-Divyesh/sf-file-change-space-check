[package]
name = "file-change-space-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only free-space and conflict planner for local file copies"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-file-change-space-check"
homepage = "https://file-change-space-check.sociobot.in"
keywords = ["cli", "filesystem", "disk-space", "copy", "manifest"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md"
]

[[bin]]
name = "fcsc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
